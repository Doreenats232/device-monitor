<!doctype html><meta charset="utf-8"><title>Device Monitor</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Segoe UI,system-ui,sans-serif;color:#e2e8f0;
  background:radial-gradient(800px 400px at 10% 0,rgba(56,189,248,.18),transparent),radial-gradient(700px 400px at 100% 0,rgba(167,139,250,.18),transparent),#070b14}
  .c{width:460px;max-width:94vw;padding:30px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
  h1{margin:0 0 6px;font-size:22px} p{color:#94a3b8;font-size:14px;margin:4px 0}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;background:#64748b}.dot.on{background:#34d399;box-shadow:0 0 12px #34d399}
  button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer;color:#e2e8f0;background:#1b2742}
  button.p{color:#06101f;background:linear-gradient(90deg,#38bdf8,#a78bfa)} button.d{color:#fca5a5;background:#2a1218}
</style>
<div class="c"><h1><span id="d" class="dot"></span><span id="t">…</span></h1>
<p id="n"></p><p id="s"></p>
<button id="tog" class="p"></button><button id="dash">Open dashboard</button>
<button id="chg">Change mode</button><button id="un" class="d">Unpair this PC</button></div>
<script>
 const $=id=>document.getElementById(id); let st={};
 const draw=s=>{st=s;$('d').className='dot'+(s.sharing?' on':'');$('t').textContent=s.sharing?'This PC is being monitored':'Sharing is off';
  $('n').textContent=`Paired as "${s.name}" · ${s.server}`;$('s').textContent=s.status||'';$('tog').textContent=s.sharing?'Stop sharing':'Start sharing'};
 dm.getState().then(draw); dm.onState(draw);
 $('tog').onclick=()=>dm.setSharing(!st.sharing);
 $('dash').onclick=()=>window.open(st.server);
 $('chg').onclick=()=>dm.changeSetup();
 $('un').onclick=()=>{if(confirm('Unpair this PC? It stops reporting.'))dm.unpair()};
</script>

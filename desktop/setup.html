<!doctype html><meta charset="utf-8"><title>Device Monitor</title>
<style>
  body{margin:0;height:100vh;display:grid;place-items:center;font-family:Segoe UI,system-ui,sans-serif;color:#e2e8f0;
  background:radial-gradient(800px 400px at 10% 0,rgba(56,189,248,.18),transparent),radial-gradient(700px 400px at 100% 0,rgba(167,139,250,.18),transparent),#070b14}
  .c{width:420px;padding:32px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
  h1{margin:0 0 4px;font-size:24px} p{color:#94a3b8;font-size:14px;margin:0 0 18px}
  input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#0b1220;color:#fff;font-size:15px}
  button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:14px;font-weight:700;font-size:15px;color:#06101f;cursor:pointer;background:linear-gradient(90deg,#38bdf8,#a78bfa)}
  #e{color:#fca5a5;font-size:13px;margin-top:10px;min-height:16px}
</style>
<div class="c"><h1>Device Monitor</h1><p>Enter your dashboard address to connect.</p>
<input id="u" placeholder="https://your-dashboard.onrender.com" autofocus>
<button id="b">Connect</button><div id="e"></div></div>
<script>
 const go=async()=>{const v=document.getElementById('u').value.trim();
  if(!/^https?:\/\//.test(v)){document.getElementById('e').textContent='Must start with http:// or https://';return}
  await dm.saveServer(v)};
 document.getElementById('b').onclick=go;
 document.getElementById('u').onkeydown=e=>{if(e.key==='Enter')go()};
</script>

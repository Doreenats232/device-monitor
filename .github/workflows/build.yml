name: Build APK and EXE
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build debug APK
        working-directory: agents/android
        run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: cp agents/android/app/build/outputs/apk/debug/app-debug.apk DeviceMonitor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DeviceMonitor-apk
          path: DeviceMonitor.apk

  desktop-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build desktop app
        working-directory: desktop
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: DeviceMonitor-desktop-exe, path: desktop/dist/DeviceMonitor.exe }

  # Publishes a public download page: https://github.com/<repo>/releases/tag/latest
  release:
    needs: [android-apk, desktop-exe]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Move the "latest" tag to this commit
        run: |
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Device Monitor (latest build)
          make_latest: true
          body: |
            **DeviceMonitor.apk** – Android app (phone agent, alerts, dashboard viewer)
            **DeviceMonitor.exe** – Windows app (monitor / be monitored / both)
          files: |
            out/DeviceMonitor.apk
            out/DeviceMonitor.exe
